<!-- ============================================== -->
<!-- OnOffus 로고 패키지 - head 스니펫 (복사하여 <head> 안에 삽입) -->
<!-- 도메인: https://www.onoffus.com -->
<!-- ============================================== -->

<!-- Favicon (assets) -->
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

<!-- Android Chrome Icons (PWA / Add to Home) -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/android-chrome-192x192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/android-chrome-512x512.png" />

<!-- Web App Manifest -->
<link rel="manifest" href="/site.webmanifest" />

<!-- Open Graph 공유 썸네일 (1200×630 권장) -->
<meta property="og:image" content="https://www.onoffus.com/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:image" content="https://www.onoffus.com/assets/og-image.png" />

<!-- theme-color (브라우저 UI / PWA) -->
<meta name="theme-color" content="#2563eb" />
<meta name="msapplication-TileColor" content="#0a1128" />
